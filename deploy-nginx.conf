# Add inside the server { } block of dehini.com (HTTPS). The app handles the /kafil prefix itself.
location /kafil/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrites any client-supplied value
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 15m;
}
location = /kafil { return 301 /kafil/; }
