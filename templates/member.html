<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="profile">
<meta property="og:locale" content="ar_DZ">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<link rel="icon" href="../../assets/logo.jpg" type="image/jpeg">
<link rel="stylesheet" href="../../assets/style.css">
<script src="../../assets/qrcode.js" defer></script>
<script src="../../assets/common.js" defer></script>
<script src="../../assets/member.js" defer></script>
</head>
<body data-member="{{slug}}" data-demo="{{demo}}">
<header><div class="wrap header-inner" data-header></div></header>
<main class="wrap member-layout">
<p class="preview-note" id="demo-note" hidden>معاينة تجريبية للبطاقة الرقمية</p>
<article class="identity" id="identity">
<div>
<img class="portrait {{photoClass}}" src="../../{{photo}}" alt="{{photoAlt}}" width="116" height="116">
<h1>{{fullName}}</h1>
<p class="role">{{role}}</p>
<p class="office">المكتب الولائي · سيدي بلعباس</p>
</div>
</article>
<p class="panel" id="unavailable" role="status" hidden>هذه البطاقة غير متاحة.</p>
<section class="contacts" data-contacts hidden>
<h2 class="section-title">تواصل مع المكتب الولائي</h2>
<p class="caption">اختر وسيلة التواصل المناسبة لك</p>
<div class="contact-grid"></div>
</section>
<section class="sharing" id="sharing" hidden>
<h2 class="section-title">مشاركة البطاقة</h2>
<div class="actions">
<button type="button" class="button primary" id="share">مشاركة البطاقة</button>
<button type="button" class="button" id="copy">نسخ رابط البطاقة</button>
<button type="button" class="button" id="qr" aria-expanded="false" aria-controls="qr-panel">رمز QR</button>
</div>
<input id="share-url" class="share-url" aria-label="رابط البطاقة" dir="ltr" readonly hidden>
<div class="qr-panel" id="qr-panel" hidden>
<canvas id="qr-image" role="img" aria-label="رمز QR لرابط البطاقة"></canvas>
<button type="button" class="button" id="qr-download">تحميل رمز QR</button>
</div>
<p class="status" id="status" role="status"></p>
</section>
</main>
<footer><div class="wrap footer-inner" data-footer></div></footer>
</body>
</html>
